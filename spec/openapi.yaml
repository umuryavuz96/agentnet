      responses:
        "200":
          description: OK
  /v1/panel/usage:
    get:
      summary: panel usage
      responses:
        "200":
          description: OK
  /v1/panel/scores:
    get:
      summary: panel scores
      responses:
        "200":
          description: OK
  /v1/panel/windows/close-all:
    post:
      summary: panel windows close-all
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/score:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: panel agents {name} score
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/tasks:
    parameters:
      - name: name
        in: path
        required: true
