      responses:
        "200":
          description: OK
  /v1/agent/trail/search:
    post:
      summary: agent trail search
      responses:
        "200":
          description: OK
  /v1/agent/tasks:
    post:
      summary: agent tasks
      responses:
        "200":
          description: OK
  /v1/agent/tasks/{id}/{op}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: op
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent tasks {id} {op}
      responses:
        "200":
          description: OK
  /v1/agent/agents:
    get:
      summary: agent agents
      responses:
        "200":
          description: OK
  /v1/agent/agents/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: agent agents {name}
      responses:
        "200":
          description: OK
  /v1/agent/teams:
    get:
      summary: agent teams
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: agent teams {id}
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent teams {id} archive
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
