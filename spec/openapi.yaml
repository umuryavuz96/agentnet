openapi: 3.1.0
info:
  title: agentnet
  version: 0.2.0
  description: Local network for Claude Code agents. Auth per route group is in docs/api.md.
paths:
  /v1/health:
    get:
      summary: health
      responses:
        "200":
          description: OK
  /v1/agent/hello:
    post:
      summary: agent hello
      responses:
        "200":
          description: OK
  /v1/agent/bye:
    post:
      summary: agent bye
      responses:
        "200":
          description: OK
  /v1/agent/poll:
    get:
      summary: agent poll
      responses:
        "200":
          description: OK
  /v1/agent/ack:
    post:
      summary: agent ack
      responses:
        "200":
          description: OK
  /v1/agent/send:
    post:
      summary: agent send
      responses:
        "200":
          description: OK
  /v1/agent/inbox:
    post:
      summary: agent inbox
      responses:
        "200":
          description: OK
  /v1/agent/report:
    post:
      summary: agent report
      responses:
        "200":
          description: OK
  /v1/agent/status:
    post:
      summary: agent status
      responses:
        "200":
          description: OK
  /v1/agent/events:
