openapi: 3.1.0
info:
  title: agentnet
  version: 0.3.0
  description: Local network for Claude Code agents. Auth per route group is in docs/api.md.
paths:
  /v1/health:
    get:
      summary: health
      responses:
        "200":
          description: OK
  /v1/agent/hello:
    post:
      summary: agent hello
      responses:
        "200":
          description: OK
  /v1/agent/bye:
    post:
      summary: agent bye
      responses:
        "200":
          description: OK
  /v1/agent/poll:
    get:
      summary: agent poll
      responses:
        "200":
          description: OK
  /v1/agent/ack:
    post:
      summary: agent ack
      responses:
        "200":
          description: OK
  /v1/agent/send:
    post:
      summary: agent send
      responses:
        "200":
          description: OK
  /v1/agent/inbox:
    post:
      summary: agent inbox
      responses:
        "200":
          description: OK
  /v1/agent/report:
    post:
      summary: agent report
      responses:
        "200":
          description: OK
  /v1/agent/status:
    post:
      summary: agent status
      responses:
        "200":
          description: OK
  /v1/agent/events:
    post:
      summary: agent events
      responses:
        "200":
          description: OK
  /v1/agent/gate:
    get:
      summary: "agent work gate: {allow:true} or {allow:false, reason}. The mod asks before each work tool; refused while the agent has no task in progress (root, members and the first 2 minutes after spawn are exempt)"
      responses:
        "200":
          description: OK
  /v1/agent/checks:
    post:
      summary: "agent checks: ask the owner to check something in the real world. Body {question, options?: 2-4 of {label, tone good|bad|neutral} (default Works/Not yet), detail?}; root may add agent. Same open question from the same agent returns the existing row (200), a new one is 201"
      responses:
        "201":
          description: Created
        "200":
          description: Already pending
    get:
      summary: "agent checks: root sees all, an agent its own; ?state=pending|answered"
      responses:
        "200":
          description: OK
  /v1/agent/trail/search:
    post:
      summary: agent trail search
      responses:
        "200":
          description: OK
  /v1/agent/tasks:
    post:
      summary: agent tasks
      responses:
        "200":
          description: OK
  /v1/agent/tasks/{id}/{op}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: op
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent tasks {id} {op}
      responses:
        "200":
          description: OK
  /v1/agent/agents:
    get:
      summary: agent agents
      responses:
        "200":
          description: OK
  /v1/agent/agents/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: agent agents {name}
      responses:
        "200":
          description: OK
  /v1/agent/teams:
    get:
      summary: agent teams
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: agent teams {id}
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent teams {id} archive
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent teams {id} members
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent teams {id} messages
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent teams {id} tasks
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}/tasks/{tid}/{op}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: tid
        in: path
        required: true
        schema:
          type: string
      - name: op
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent teams {id} tasks {tid} {op}
      responses:
        "200":
          description: OK
  /v1/admin/spawn:
    post:
      summary: admin spawn (body field `goal`, 8+ characters, is required for new agents; members are exempt)
      responses:
        "200":
          description: OK
        "422":
          description: "goal is required: what does done look like? (AGENTNET_REQUIRE_GOAL=0 turns the rule off)"
  /v1/admin/plan-spawn:
    post:
      summary: admin plan spawn (no side effects; GET reads query params)
      responses:
        "200":
          description: OK
  /v1/admin/despawn:
    post:
      summary: admin despawn
      responses:
        "200":
          description: OK
  /v1/admin/trail/inject:
    post:
      summary: admin trail inject
      responses:
        "200":
          description: OK
  /v1/admin/agents/{name}/placement:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: admin agents {name} placement
      responses:
        "200":
          description: OK
  /v1/admin/agents/{name}/grade:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: admin agents {name} grade
      responses:
        "200":
          description: OK
  /v1/panel/snapshot:
    get:
      summary: panel snapshot
      responses:
        "200":
          description: OK
  /v1/panel/stream:
    get:
      summary: panel stream
      responses:
        "200":
          description: OK
  /v1/panel/usage:
    get:
      summary: panel usage
      responses:
        "200":
          description: OK
  /v1/panel/scores:
    get:
      summary: panel scores
      responses:
        "200":
          description: OK
  /v1/panel/discipline:
    get:
      summary: "panel discipline: score per day (last 30), today, the stored daily snapshots"
      responses:
        "200":
          description: OK
  /v1/panel/windows/close-all:
    post:
      summary: panel windows close-all
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/score:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: panel agents {name} score
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/tasks:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: panel agents {name} tasks
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/message:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel agents {name} message
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/open:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel agents {name} open
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/close:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel agents {name} close
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/schedules:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: panel agents {name} schedules
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/stop:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel agents {name} stop
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/despawn:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel agents {name} despawn
      responses:
        "200":
          description: OK
  /v1/panel/agents/{name}/run-schedule:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel agents {name} run-schedule
      responses:
        "200":
          description: OK
  /v1/panel/teams:
    get:
      summary: panel teams
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: panel teams {id}
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel teams {id} archive
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel teams {id} members
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel teams {id} messages
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel teams {id} tasks
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}/tasks/{tid}/{op}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: tid
        in: path
        required: true
        schema:
          type: string
      - name: op
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel teams {id} tasks {tid} {op}
      responses:
        "200":
          description: OK
  /v1/panel/checks:
    get:
      summary: "panel checks: owner checks, ?state=pending|answered"
      responses:
        "200":
          description: OK
  /v1/panel/checks/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: "panel checks resolve: body {option: label or index, note?}. Sends root a report from owner. 409 when already resolved"
      responses:
        "200":
          description: OK
        "409":
          description: Already resolved
  /v1/panel/trails/search:
    get:
      summary: panel trails search
      responses:
        "200":
          description: OK
  /v1/panel/trails/stats:
    get:
      summary: panel trails stats
      responses:
        "200":
          description: OK
  /v1/panel/summary:
    get:
      summary: panel summary: counts for a host badge
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  live: {}
                  working: {}
                  blocked: {}
  /v1/panel/bgjobs:
    get:
      summary: panel background job list
      responses:
        "200":
          description: OK
  /v1/panel/bgjobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: panel background job detail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  status: {}
                  progress: {}
                  log: {}
                  outputs: {}
  /v1/panel/bgjobs/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: panel background job output file
      responses:
        "200":
          description: OK
  /v1/panel/arsenal:
    get:
      summary: panel persona catalog
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated: {}
                  agents: {}
                  roles: {}
                  decisions: {}
                  sources: {}
  /v1/panel/arsenal/agent:
    get:
      summary: panel persona text
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry: {}
                  body: {}
  /v1/panel/arsenal/roles:
    put:
      summary: panel save role defaults
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles: {}
        "403":
          description: Forbidden (root only)
  /v1/panel/compact:
    get:
      summary: panel auto-compact window setting (default and per-role overrides)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  default: {}
                  roles: {}
                  min: {}
                  max: {}
                  fallback: {}
    put:
      summary: panel save the auto-compact window (applies to new spawns only)
      responses:
        "200":
          description: OK
        "400":
          description: Bad value
        "403":
          description: Forbidden (root only)
  /v1/panel/routing:
    get:
      summary: panel model routing settings and mode
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields: {}
                  mode: {}
                  decisions: {}
                  backups: {}
                  error: {}
    put:
      summary: panel save model routing settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields: {}
                  mode: {}
                  decisions: {}
                  backups: {}
                  error: {}
        "403":
          description: Forbidden (root only)
  /v1/panel/hooks:
    get:
      summary: panel Claude Code hooks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hooks: {}
                  backups: {}
  /v1/panel/hooks/nodes:
    get:
      summary: panel hook nodes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: {}
  /v1/panel/hooks/stream:
    get:
      summary: panel hook fires (SSE)
      responses:
        "200":
          description: OK
  /v1/panel/hooks/fires:
    get:
      summary: panel past hook fires
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: {}
                  fires: {}
  /v1/panel/hooks/{id}/enabled:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel switch a hook on or off
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hooks: {}
                  backups: {}
        "403":
          description: Forbidden (root only)
  /v1/panel/hooks/rollback:
    post:
      summary: panel restore the newest hooks backup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: {}
                  hooks: {}
                  backups: {}
        "403":
          description: Forbidden (root only)
  /v1/panel/hooks/templates:
    get:
      summary: panel hook templates with their state (root only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates: {}
        "403":
          description: Forbidden (root only)
  /v1/panel/hooks/install:
    post:
      summary: "panel install one hook. Body {templateId} or {custom: {event, matcher?, command, timeout?}}, optional dryRun. Root only"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId: {}
                custom: {}
                dryRun: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: {}
                  backup: {}
                  fragment: {}
                  dryRun: {}
                  hooks: {}
                  backups: {}
        "400":
          description: Bad input
        "403":
          description: Forbidden (root only)
        "404":
          description: Unknown template
        "409":
          description: Already installed
  /v1/panel/hooks/install-set:
    post:
      summary: "panel install several template hooks in one write. Body {ids, dryRun?}. Root only"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: {}
                dryRun: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: {}
                  skipped: {}
                  fragment: {}
                  backup: {}
                  dryRun: {}
                  hooks: {}
                  backups: {}
        "400":
          description: Bad input
        "403":
          description: Forbidden (root only)
  /v1/panel/hooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: panel remove an installed hook (backs up settings first). Root only
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup: {}
                  hooks: {}
                  backups: {}
        "400":
          description: Unknown hook
        "403":
          description: Forbidden (root only)
  /v1/panel/director:
    get:
      summary: panel first-run setup (tools found, live root, tmux session, the command that starts the director for ?dir=)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  home: {}
                  dir: {}
                  dirError: {}
                  tools: {}
                  root: {}
                  triage:
                    type: string
                    enum: [off, ok, nologin, switched-off, unknown]
                    description: nologin = the last 5 triage records in 24 h were all skips because claude is missing or not logged in.
                  session: {}
                  sessionName: {}
                  command: {}
  /v1/panel/director/start:
    post:
      summary: panel start the director in a detached tmux session (body {dir}); root only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dir: {}
                restart: {}
      responses:
        "200":
          description: OK
        "400":
          description: Bad folder
        "403":
          description: Forbidden (root only)
        "409":
          description: A director session already exists
        "422":
          description: tmux or claude missing, or tmux failed
  /v1/panel/director/move:
    post:
      summary: panel stop a hand-started director and start it again in the same folder in the agentnet-root tmux session; root only
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden (root only)
        "422":
          description: The director is not running, did not stop, or tmux or claude is missing
  /v1/panel/director/pick-folder:
    post:
      summary: panel open the server machine's native folder dialog (macOS osascript, Linux zenity); root only
      responses:
        "200":
          description: "{dir} the chosen absolute path, or {dir: null, cancelled: true}"
        "403":
          description: Forbidden (root only)
        "501":
          description: No folder dialog here (no GUI, no zenity, or no permission)
        "500":
          description: The dialog failed
  /v1/panel/update:
    get:
      summary: panel update status (current, latest, availability, blocked reason, job)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: {}
                  latest: {}
                  available: {}
                  checkedAt: {}
                  notes: {}
                  releaseUrl: {}
                  web: {}
                  mode: {}
                  auto: {}
                  job: {}
  /v1/panel/update/check:
    post:
      summary: panel check for a new release now
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden (root only)
  /v1/panel/update/run:
    post:
      summary: panel move to the newest release tag (body {tag}); starts a detached updater
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              additionalProperties: false
              properties:
                tag:
                  type: string
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
        "400":
          description: Bad body or tag
        "403":
          description: Forbidden (root only, or web updates off)
        "409":
          description: Not the newest release, locked, or blocked
  /v1/panel/update/stream:
    get:
      summary: panel update progress (SSE; hello carries the whole job log)
      responses:
        "200":
          description: OK
