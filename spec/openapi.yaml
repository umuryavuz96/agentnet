      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel agents {name} close
      responses:
        "200":
          description: OK
  /v1/panel/teams:
    get:
      summary: panel teams
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
