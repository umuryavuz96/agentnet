    get:
      summary: panel teams {id}
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel teams {id} archive
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel teams {id} members
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel teams {id} messages
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel teams {id} tasks
      responses:
        "200":
          description: OK
  /v1/panel/teams/{id}/tasks/{tid}/{op}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: tid
        in: path
        required: true
        schema:
          type: string
      - name: op
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel teams {id} tasks {tid} {op}
      responses:
        "200":
          description: OK
  /v1/panel/trails/search:
    get:
      summary: panel trails search
      responses:
        "200":
          description: OK
  /v1/panel/trails/stats:
    get:
      summary: panel trails stats
      responses:
        "200":
          description: OK
  /v1/panel/summary:
    get:
      summary: panel summary: counts for a host badge
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  live: {}
                  working: {}
                  blocked: {}
  /v1/panel/bgjobs:
    get:
      summary: panel background job list
      responses:
        "200":
          description: OK
  /v1/panel/bgjobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: panel background job detail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {}
                  status: {}
                  progress: {}
                  log: {}
                  outputs: {}
  /v1/panel/bgjobs/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: panel background job output file
      responses:
        "200":
          description: OK
  /v1/panel/arsenal:
    get:
      summary: panel persona catalog
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated: {}
                  agents: {}
                  roles: {}
                  decisions: {}
                  sources: {}
  /v1/panel/arsenal/agent:
    get:
      summary: panel persona text
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry: {}
                  body: {}
  /v1/panel/arsenal/roles:
    put:
      summary: panel save role defaults
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles: {}
        "403":
          description: Forbidden (root only)
  /v1/panel/routing:
    get:
      summary: panel model routing settings and mode
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields: {}
                  mode: {}
                  decisions: {}
                  backups: {}
                  error: {}
    put:
      summary: panel save model routing settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields: {}
                  mode: {}
                  decisions: {}
                  backups: {}
                  error: {}
        "403":
          description: Forbidden (root only)
  /v1/panel/hooks:
    get:
      summary: panel Claude Code hooks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hooks: {}
                  backups: {}
  /v1/panel/hooks/nodes:
    get:
      summary: panel hook nodes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: {}
  /v1/panel/hooks/stream:
    get:
      summary: panel hook fires (SSE)
      responses:
        "200":
          description: OK
  /v1/panel/hooks/fires:
    get:
      summary: panel past hook fires
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: {}
                  fires: {}
  /v1/panel/hooks/{id}/enabled:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: panel switch a hook on or off
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hooks: {}
                  backups: {}
        "403":
          description: Forbidden (root only)
  /v1/panel/hooks/rollback:
    post:
      summary: panel restore the newest hooks backup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: {}
                  hooks: {}
                  backups: {}
        "403":
          description: Forbidden (root only)
