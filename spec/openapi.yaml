    post:
      summary: agent teams {id} members
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent teams {id} messages
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent teams {id} tasks
      responses:
        "200":
          description: OK
  /v1/agent/teams/{id}/tasks/{tid}/{op}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: tid
        in: path
        required: true
        schema:
          type: string
      - name: op
        in: path
        required: true
        schema:
          type: string
    post:
      summary: agent teams {id} tasks {tid} {op}
      responses:
        "200":
          description: OK
  /v1/admin/spawn:
    post:
      summary: admin spawn
      responses:
        "200":
          description: OK
  /v1/admin/despawn:
    post:
      summary: admin despawn
      responses:
        "200":
          description: OK
  /v1/admin/trail/inject:
    post:
      summary: admin trail inject
      responses:
        "200":
          description: OK
  /v1/admin/agents/{name}/placement:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: admin agents {name} placement
      responses:
        "200":
          description: OK
  /v1/admin/agents/{name}/grade:
    parameters:
